<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="我的清单">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>我的清单</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">
<style>
:root {
  --accent: #194ff4;
  --bg: #f2f2f7;
  --card: #ffffff;
  --text: #1c1c1e;
  --text2: #8e8e93;
  --danger: #ff3b30;
  --sep: rgba(60,60,67,.12);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --card: #1c1c1e;
    --text: #ffffff;
    --text2: #8e8e93;
    --sep: rgba(84,84,88,.65);
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
#app {
  max-width: 560px;
  margin: 0 auto;
  min-height: 100vh;
  padding-top: env(safe-area-inset-top);
  display: flex;
  flex-direction: column;
}
header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--bg);
  padding: calc(env(safe-area-inset-top) + 10px) 20px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
header h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
header button {
  width: 34px; height: 34px;
  border-radius: 50%;
  border: none;
  background: var(--accent);
  color: #fff;
  font-size: 24px;
  line-height: 1;
  cursor: pointer;
  display: grid;
  place-items: center;
  padding-bottom: 3px;
}
main { flex: 1; padding: 4px 16px calc(env(safe-area-inset-bottom) + 24px); }
#list { list-style: none; background: var(--card); border-radius: 14px; overflow: hidden; }
#list li {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 0.5px solid var(--sep);
  transition: background .15s;
}
#list li:last-child { border-bottom: none; }
#list li:active { background: var(--sep); }
.circle {
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 2px solid var(--text2);
  flex-shrink: 0;
  cursor: pointer;
  display: grid;
  place-items: center;
  color: transparent;
  font-size: 14px;
  transition: all .2s;
}
.circle.done {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.tinfo { flex: 1; min-width: 0; }
.ttitle { font-size: 17px; line-height: 1.35; word-break: break-word; }
.tnote { font-size: 13px; color: var(--text2); margin-top: 2px; word-break: break-word; }
li.done-task .ttitle { text-decoration: line-through; color: var(--text2); }
.chev { color: var(--text2); font-size: 15px; flex-shrink: 0; }
footer.tip {
  text-align: center;
  color: var(--text2);
  font-size: 12px;
  padding: 18px 0 8px;
}
#empty {
  text-align: center;
  padding: 80px 30px;
}
#empty .big { font-size: 56px; opacity: .25; }
#empty h2 { font-size: 19px; margin: 14px 0 6px; }
#empty p { color: var(--text2); font-size: 14px; }
dialog {
  border: none;
  border-radius: 16px;
  background: var(--card);
  color: var(--text);
  width: min(92vw, 420px);
  padding: 0;
  outline: none;
}
dialog::backdrop { background: rgba(0,0,0,.4); }
.dlg-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
}
.dlg-head .hbtn {
  border: none; background: none; color: var(--accent);
  font-size: 16px; cursor: pointer;
}
.dlg-head .hbtn:disabled { color: var(--text2); opacity: .4; cursor: default; }
.dlg-head strong { font-size: 16px; }
.dlg-body { padding: 0 18px; display: flex; flex-direction: column; gap: 14px; padding-bottom: 18px; }
.dlg-body input[type=text], .dlg-body textarea {
  width: 100%;
  border: none;
  background: var(--bg);
  color: var(--text);
  border-radius: 10px;
  padding: 11px 12px;
  font-size: 16px;
  font-family: inherit;
}
.dlg-body textarea { min-height: 76px; resize: none; }
.dlg-body input:focus, .dlg-body textarea:focus { outline: 2px solid var(--accent); }
.dlg-body label small { display: block; color: var(--text2); font-size: 12px; margin-bottom: 5px; }
.dlg-danger {
  width: 100%;
  border: none;
  background: none;
  color: var(--danger);
  font-size: 16px;
  padding: 10px 0 4px;
  cursor: pointer;
}
dialog[open] { animation: pop .18s ease-out; }
@keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>我的清单</h1>
    <button id="addBtn" aria-label="新建任务">＋</button>
  </header>
  <main>
    <ul id="list"></ul>
    <div id="empty" hidden>
      <div class="big">☑️</div>
      <h2>还没有任务</h2>
      <p>点击右上角 ＋ 添加第一个任务</p>
    </div>
    <footer class="tip">数据保存在本机浏览器 · 已支持离线使用</footer>
  </main>
</div>

<dialog id="dlg">
  <div class="dlg-head">
    <button class="hbtn" id="cancelBtn">取消</button>
    <strong id="dlgTitle">新建任务</strong>
    <button class="hbtn" id="saveBtn" disabled>保存</button>
  </div>
  <div class="dlg-body">
    <label>
      <small>任务</small>
      <input type="text" id="fTitle" placeholder="要做什么？" autocomplete="off">
    </label>
    <label>
      <small>备注（可选）</small>
      <textarea id="fNote" placeholder="详细一点…"></textarea>
    </label>
    <button class="dlg-danger" id="delBtn" hidden>删除任务</button>
  </div>
</dialog>

<script>
const KEY = "todoapp.tasks";
let tasks = load();
let editingId = null;

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; }
  catch { return []; }
}
function save() { localStorage.setItem(KEY, JSON.stringify(tasks)); }

const $ = (id) => document.getElementById(id);
const listEl = $("list"), emptyEl = $("empty"), dlg = $("dlg");

function render() {
  const order = [...tasks].sort((a, b) =>
    (a.done === b.done) ? new Date(b.createdAt) - new Date(a.createdAt) : (a.done ? 1 : -1));
  listEl.innerHTML = "";
  for (const t of order) {
    const li = document.createElement("li");
    li.className = t.done ? "done-task" : "";
    const c = document.createElement("div");
    c.className = "circle" + (t.done ? " done" : "");
    c.textContent = "✓";
    c.onclick = (e) => { e.stopPropagation(); toggle(t.id); };
    const info = document.createElement("div");
    info.className = "tinfo";
    const title = document.createElement("div");
    title.className = "ttitle";
    title.textContent = t.title;
    info.appendChild(title);
    if (t.note) {
      const note = document.createElement("div");
      note.className = "tnote";
      note.textContent = t.note;
      info.appendChild(note);
    }
    li.appendChild(c);
    li.appendChild(info);
    li.onclick = () => openEditor(t.id);
    listEl.appendChild(li);
  }
  emptyEl.hidden = tasks.length > 0;
  listEl.style.display = tasks.length ? "block" : "none";
}

function toggle(id) {
  const t = tasks.find(t => t.id === id);
  if (t) { t.done = !t.done; save(); render(); }
}

function add(title, note) {
  tasks.push({ id: crypto.randomUUID(), title, note, done: false, createdAt: new Date().toISOString() });
  save(); render();
}
function update(id, patch) {
  const t = tasks.find(t => t.id === id);
  if (t) { Object.assign(t, patch); save(); render(); }
}
function remove(id) {
  tasks = tasks.filter(t => t.id !== id);
  save(); render();
}

function openEditor(id) {
  editingId = id;
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  $("dlgTitle").textContent = "编辑任务";
  $("fTitle").value = t.title;
  $("fNote").value = t.note;
  $("delBtn").hidden = false;
  $("saveBtn").disabled = false;
  dlg.showModal();
  $("fTitle").focus();
}
function openCreator() {
  editingId = null;
  $("dlgTitle").textContent = "新建任务";
  $("fTitle").value = "";
  $("fNote").value = "";
  $("delBtn").hidden = true;
  $("saveBtn").disabled = true;
  dlg.showModal();
  $("fTitle").focus();
}

$("addBtn").onclick = openCreator;
$("cancelBtn").onclick = () => dlg.close();
$("delBtn").onclick = () => { remove(editingId); dlg.close(); };
$("saveBtn").onclick = () => {
  const title = $("fTitle").value.trim();
  if (!title) return;
  const note = $("fNote").value.trim();
  if (editingId) update(editingId, { title, note });
  else add(title, note);
  dlg.close();
};
$("fTitle").addEventListener("input", () => {
  $("saveBtn").disabled = !$("fTitle").value.trim();
});
$("fTitle").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !$("saveBtn").disabled) { e.preventDefault(); $("saveBtn").click(); }
});
dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });

render();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
</script>
</body>
</html>
